[project]
name = "turneval"
version = "0.1.0"
description = "Outcome evaluation for voice agents: deterministic verdicts, behavioral counters, and human acceptance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
turneval = "turneval.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
